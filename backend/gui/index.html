<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Character</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="selector-view" class="view">
            <h1>Select Camera Source</h1>
            <div class="form-group">
                <label for="camera-select">Available Cameras:</label>
                <select id="camera-select"></select>
            </div>
            <button id="start-btn">Start Capture</button>
        </div>

        <div id="capture-view" class="view active">
            <h1>Live Feed & Pose Tracking</h1>
            <div class="video-container">
                <img id="video-feed" alt="Video Feed" />
                <div class="video-overlay-buttons">
                    <button id="change-camera-btn">Change Camera</button>
                    <button id="fullscreen-btn">Toggle Fullscreen</button>
                </div>
            </div>
            <p class="status-text">Broadcasting landmark data to <strong>ws://localhost:8765</strong></p>
            <p class="info-text">Change visual mode: [1] Default, [2] Skeleton, [3] Neon, [4] Ghost, [5] Rainbow, [6] Underwater, [7] Matrix, [8] Party, [P] Punk, [C] Comic</p>
            
            <div id="filter-controls">
                <h3>Custom Video Filters</h3>
                <div class="filter-group">
                    <input type="checkbox" id="mirror-toggle" checked />
                    <label for="mirror-toggle">Mirror Video Feed</label>
                </div>
                <div class="filter-group">
                    <input type="checkbox" id="posterize-toggle" />
                    <label for="posterize-toggle">Posterize</label>
                    <input type="range" id="posterize-slider" min="2" max="32" value="8" />
                    <span id="posterize-value">8</span>
                </div>
                <div class="filter-group">
                    <input type="checkbox" id="threshold-toggle" />
                    <label for="threshold-toggle">Threshold</label>
                    <input type="range" id="threshold-slider" min="0" max="255" value="127" />
                    <span id="threshold-value">127</span>
                </div>
                <div class="filter-group">
                    <label for="opacity-slider">Video Opacity</label>
                    <input type="range" id="opacity-slider" min="0" max="100" value="100" />
                    <span id="opacity-value">100</span>
                </div>
            </div>

            <button id="stop-btn">Stop Capture</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
